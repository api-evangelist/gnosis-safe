apis:
- aid: gnosis-safe:delegates
  name: Safe Delegates API
  description: >-
    Endpoints for managing delegate relationships on a Safe. Delegates are addresses authorized by Safe
    owners to propose transactions without being full owners. Supports creating, listing, and deleting
    delegates for a given Safe or delegator address.
  humanURL: https://docs.safe.global/core-api/transaction-service-overview
  baseURL: https://api.safe.global/tx-service/eth/api/v1
  tags:
  - Delegates
  - Multisig
  - Authorization
  properties:
  - type: Documentation
    url: https://docs.safe.global/core-api/transaction-service-overview
- aid: gnosis-safe:messages
  name: Safe Messages API
  description: >-
    Endpoints for off-chain message signing via Safe smart accounts. Allows creating signed messages for
    a Safe, retrieving existing messages by their hash, and listing all messages associated with a Safe
    address. Compliant with EIP-191 and EIP-712 typed data signatures.
  humanURL: https://docs.safe.global/core-api/transaction-service-overview
  baseURL: https://api.safe.global/tx-service/eth/api/v1
  tags:
  - Messages
  - EIP-712
  - Signatures
  - Off-chain
  properties:
  - type: Documentation
    url: https://docs.safe.global/core-api/transaction-service-overview
- aid: gnosis-safe:4337
  name: Safe 4337 User Operations API
  description: >-
    Endpoints supporting ERC-4337 account abstraction user operations for Safe smart accounts. Allows
    listing, retrieving, and managing ERC-4337 user operations associated with a Safe, enabling gas-abstracted
    and sponsored transactions via bundlers.
  humanURL: https://docs.safe.global/core-api/transaction-service-overview
  baseURL: https://api.safe.global/tx-service/eth/api/v1
  tags:
  - ERC-4337
  - Account Abstraction
  - User Operations
  - Bundler
  properties:
  - type: Documentation
    url: https://docs.safe.global/core-api/transaction-service-overview
- aid: gnosis-safe:api-kit
  name: Safe API Kit (TypeScript SDK)
  description: >-
    Official TypeScript client SDK for the Safe Transaction Service API. Wraps all Transaction Service
    endpoints with typed methods for proposing transactions, confirming signatures, fetching pending and
    executed transactions, and managing delegates. Distributed via npm as @safe-global/api-kit.
  humanURL: https://docs.safe.global/sdk/api-kit
  baseURL: https://www.npmjs.com/package/@safe-global/api-kit
  tags:
  - SDK
  - TypeScript
  - JavaScript
  - npm
  properties:
  - type: Documentation
    url: https://docs.safe.global/sdk/api-kit
  - type: Repository
    url: https://github.com/safe-global/safe-core-sdk
